<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>French Press</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;600&family=Lexend:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="wrapper">
    <h1>French Press</h1>
    <nav class="menu" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="filter.html">Filtering Water</a>
      <a href="grind.html">How to Grind</a>
      <a href="coldbrew.html">Make Cold-Brew</a>
      <a href="frenchpress.html" aria-current="page">French Press</a>
      <a href="about.html">About</a>
    </nav>

    <p class="centered">For excellent French-press coffee, follow these steps.</p>

    <details open>
      <summary class="stepTitle">Step four - Wait four minutes</summary>
      <div class="stepContent">
        <div class="stepDescription">
          <progress id="timerBar" value="240" max="240"></progress>
          <p id="timerText" aria-live="polite" class="centered">Click Start to begin a 4-minute brew timer.</p>
          <div class="centered">
            <button id="startTimer">Start</button>
            <button id="resetTimer" disabled>Reset</button>
          </div>
          <p class="indented">Use this timer to track your brewing phase. You're aiming for four minutes.</p>
        </div>
      </div>
    </details>

    </div>

  <script>
    $(function () {
      const $start = $("#startTimer");
      const $reset = $("#resetTimer");
      const $out = $("#timerText");
      const $bar = $("#timerBar"); // Added this to fix your previous error

      let timer = null;
      let seconds = 240;

      function fmt(s){
        const m = Math.floor(s/60);
        const ss = String(s % 60).padStart(2,"0");
        return `${m}:${ss}`;
      }

      function tick(){
        seconds--;
        $out.text(`Steeping... ${fmt(seconds)}`);
        $bar.val(seconds); 
        if (seconds <= 0){
          clearInterval(timer);
          timer = null;
          $out.html("<span class='ok'>✅ Ready to plunge!</span>");
          $start.prop("disabled", false);
        }
      }

      $start.on("click", function() {
        if (timer) return;
        seconds = 240;
        $bar.val(240);
        $out.text(`Steeping... ${fmt(seconds)}`);
        $start.prop("disabled", true);
        $reset.prop("disabled", false);
        timer = setInterval(tick, 1000);
      });

      $reset.on("click", function() {
        if (timer){ clearInterval(timer); timer = null; }
        seconds = 240;
        $bar.val(240);
        $out.text("Click Start to begin a 4-minute steep.");
        $start.prop("disabled", false);
        $reset.prop("disabled", true);
      });
    });
  </script>
</body>
</html>
