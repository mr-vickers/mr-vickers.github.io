<!doctype html>
<html>
	<!-- Index -->
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&family=Lexend&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Lab 4: jQuery</title>
<link href="../lab4jquery/css/lab4.css" rel="stylesheet" type="text/css">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
	<h1> Coffee Grinding and Sizes
	<br></h1>
	<p class="centered">Click each image below to cycle through the varying stages of coffee!
	</p>
<br><br>
	<img id="phaseImage" src="img/wholebean.png" alt="Whole coffee beans in a pile" class="centered-img">
	<h2 id="phaseTitle"> Whole Bean </h2>
	<p class="centered" id="phaseText">Roasted coffee starts off as a whole bean.
	</p>
	
<button id="next" class="centered">Next</button>
	<div id="quiz" aria-live="polite">
  <img id="coffeeCup" src="img/coffeecup.png" alt="Coffee cup full of coffee">
  <h2>Quick Quiz</h2>
  <p>Which grind size is best for French press?</p>

  <!-- Choices (like koala_question2), clickable words -->
  <h2 class="choices option" data-correct="false" role="button" tabindex="0">Whole Bean</h2>
  <h2 class="choices option" data-correct="true"  role="button" tabindex="0">Coarse</h2>
  <h2 class="choices option" data-correct="false" role="button" tabindex="0">Fine</h2>

  <div id="feedback" class="centered" style="min-height:2.2rem;"></div>
</div>
	
	   <script>
		   //function to hold the different phases of coffee grind
  $(document).ready(function() {
    const phase = [
      { image: "img/wholebean.png",  title: "Whole Bean",  text: "Roasted coffee starts off as a whole bean." },
      { image: "img/coarsegrind.png", title: "Coarse Grind", text: "Coarse grind is ideal for French press and cold brew." },
      { image: "img/finegrind.png",   title: "Fine Grind",   text: "Fine grind is perfect for espresso and moka pots." }
    ];
	  //sets the start to zero
    let current = 0;
	  //sets an end point for trigger purposes
    const last = phase.length - 1;

    function update() {
      $("#phaseImage").attr("src", phase[current].image);
      $("#phaseTitle").text(phase[current].title);
      $("#phaseText").text(phase[current].text);
      $("#next").text(current === last ? "Quiz" : "Next");
    }

    // Advance on image click without looping if I did it right
    $("#phaseImage").on("click", function() {
      if (current < last) {
        current++;
        update();
      }
    });

    // Button behavior: Next to advance; Quiz willshow quiz; Start Over will reset
    $("#next").on("click", function() {
      const label = $(this).text().trim();

      if (label === "Next") {
        if (current < last) {
          current++;
          update();
        }
        return;
      }

      if (label === "Quiz") {
        // Enter quiz mode 
        $("#phaseImage, #phaseTitle, #phaseText").hide();
        $("#quiz").fadeIn(150);
        $("#feedback").html("");                       // clear old feedback
        $(".option").removeClass("correct wrong");     // clear old styles
        $(this).text("Start Over");
        return;
      }

      if (label === "Start Over") {
        // Reset everything
        current = 0;
        update();
        $("#quiz").hide();
        $("#phaseImage, #phaseTitle, #phaseText").show();
        return;
      }
    });

    // === Quiz logic (like koala_question2 but without inline onclicks) ===
    function rightAnswer(){
      $("#feedback").html("<h2 style='color:green'>✅ Correct! French press uses a coarse grind.</h2>");
    }
    function wrongAnswer1(){
      $("#feedback").html("<h2 style='color:red'>❌ Whole beans aren’t ground at all. Please don't use these. Try again.</h2>");
    }
    function wrongAnswer2(){
      $("#feedback").html("<h2 style='color:red'>❌ Fine grind is for espresso and will be difficult to use with the french press. Try again.</h2>");
    }

    // Click a choice: show specific feedback and style
    $("#quiz").on("click", ".option", function() {
      const isCorrect = $(this).data("correct") === true || $(this).attr("data-correct") === "true";
      $(".option").removeClass("correct wrong");
      if (isCorrect) {
        $(this).addClass("correct");
        rightAnswer();
      } else {
        $(this).addClass("wrong");
        // Pick which wrong feedback you want (like tutorial’s wrongAnswer1/2)
        const text = $(this).text().trim().toLowerCase();
        if (text.includes("whole")) wrongAnswer1();
        else wrongAnswer2();
      }
    });

    // Keyboard support (Enter/Space triggers click)
    $("#quiz").on("keydown", ".option", function(e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        $(this).click();
      }
    });

    // Initial render
    update();
  });
</script>

</body>
</html>
